spring.application.name=fileserver
server.address=0.0.0.0
server.port=8080

# Storage location. Override with FILESERVER_STORAGE_DIR env var or -Dfileserver.storage-dir=...
fileserver.storage-dir=${FILESERVER_STORAGE_DIR:#{systemProperties['user.home']}/fileserver-storage}

# Multipart upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
spring.servlet.multipart.file-size-threshold=10MB

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.pri.fileserver=INFO
